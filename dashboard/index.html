<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PPE Compliance Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg:        #0a0c10;
    --surface:   #111318;
    --border:    #1e2330;
    --accent:    #00e5ff;
    --green:     #00e676;
    --red:       #ff1744;
    --yellow:    #ffea00;
    --text:      #e0e6f0;
    --muted:     #5a6480;
    --radius:    10px;
    --font-mono: 'Space Mono', monospace;
    --font-body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    display: grid;
    grid-template-rows: 56px 1fr;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .logo { font-family: var(--font-mono); font-size: 14px; color: var(--accent); letter-spacing: 2px; }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .header-right { margin-left: auto; display: flex; gap: 24px; align-items: center; }
  .stat-chip {
    font-family: var(--font-mono); font-size: 12px; color: var(--muted);
  }
  .stat-chip span { color: var(--text); font-size: 15px; margin-left: 4px; }

  /* ── Layout ── */
  .main {
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: 1fr 200px;
    gap: 1px;
    background: var(--border);
    height: calc(100vh - 56px);
    overflow: hidden;
  }

  .panel {
    background: var(--bg);
    overflow: hidden;
    position: relative;
  }

  /* ── Stream panel ── */
  .stream-panel {
    grid-row: 1 / 2;
    grid-column: 1 / 2;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  .stream-panel img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }

  /* ── Side panel ── */
  .side-panel {
    grid-row: 1 / 3;
    grid-column: 2 / 3;
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--border);
  }

  .side-block {
    background: var(--surface);
    padding: 16px;
    flex: 1;
    overflow: hidden;
  }

  .block-title {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  /* ── Metric cards ── */
  .metric-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .metric-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    text-align: center;
  }
  .metric-val {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }
  .metric-lbl {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .green { color: var(--green); }
  .red   { color: var(--red); }
  .cyan  { color: var(--accent); }
  .yellow{ color: var(--yellow); }

  /* ── Violation log ── */
  .viol-log {
    overflow-y: auto;
    max-height: 200px;
    font-size: 12px;
  }
  .viol-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-family: var(--font-mono);
    animation: fadein 0.3s ease;
  }
  @keyframes fadein { from{opacity:0;transform:translateX(6px)} to{opacity:1;transform:none} }
  .viol-row .tag {
    background: rgba(255,23,68,0.15);
    color: var(--red);
    border: 1px solid rgba(255,23,68,0.3);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 10px;
  }
  .viol-row .tid { color: var(--accent); }
  .no-violations { color: var(--muted); font-size: 12px; padding: 8px 0; }

  /* ── Bottom chart ── */
  .chart-panel {
    grid-row: 2 / 3;
    grid-column: 1 / 2;
    padding: 12px 20px 8px;
    background: var(--surface);
    display: flex;
    flex-direction: column;
  }
  .chart-panel canvas { flex: 1; min-height: 0; }

  /* ── Alert banner ── */
  .alert-banner {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 42px;
    background: rgba(255,23,68,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 2px;
    color: #fff;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    z-index: 99;
  }
  .alert-banner.visible { transform: translateY(0); }

  /* ── Connection status ── */
  .conn-status {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    background: rgba(0,230,118,0.12);
    color: var(--green);
    border: 1px solid rgba(0,230,118,0.3);
  }
  .conn-status.disconnected {
    background: rgba(255,23,68,0.12);
    color: var(--red);
    border-color: rgba(255,23,68,0.3);
  }
</style>
</head>
<body>

<header>
  <div class="live-dot" id="liveDot"></div>
  <span class="logo">PPE · COMPLIANCE · MONITOR</span>
  <div class="header-right">
    <div class="stat-chip">FPS<span id="hFps">—</span></div>
    <div class="stat-chip">FRAME<span id="hFrame">—</span></div>
    <span class="conn-status disconnected" id="connStatus">OFFLINE</span>
  </div>
</header>

<div class="main">

  <!-- Live stream -->
  <div class="panel stream-panel">
    <img id="streamImg" src="/stream" alt="Live feed" onerror="this.style.opacity=0.3" />
  </div>

  <!-- Side metrics + violations -->
  <div class="side-panel">
    <div class="side-block">
      <div class="block-title">Live Metrics</div>
      <div class="metric-grid">
        <div class="metric-card">
          <div class="metric-val cyan" id="mPersons">0</div>
          <div class="metric-lbl">Persons</div>
        </div>
        <div class="metric-card">
          <div class="metric-val green" id="mCompliant">0</div>
          <div class="metric-lbl">Compliant</div>
        </div>
        <div class="metric-card">
          <div class="metric-val red" id="mViolations">0</div>
          <div class="metric-lbl">Violations</div>
        </div>
        <div class="metric-card">
          <div class="metric-val yellow" id="mFps">0</div>
          <div class="metric-lbl">FPS</div>
        </div>
      </div>
    </div>

    <div class="side-block" style="flex:1.4">
      <div class="block-title">Violation Log</div>
      <div class="viol-log" id="violLog">
        <div class="no-violations">No violations detected</div>
      </div>
    </div>

    <div class="side-block">
      <div class="block-title">Counting Lines</div>
      <div id="lineCountsContainer" style="font-size:12px;color:var(--muted);">
        No counting lines configured
      </div>
    </div>
  </div>

  <!-- Bottom timeline chart -->
  <div class="panel chart-panel">
    <div class="block-title" style="margin-bottom:8px">Person Count · Timeline</div>
    <canvas id="timelineChart"></canvas>
  </div>

</div>

<!-- Crowd alert banner -->
<div class="alert-banner" id="alertBanner">
  ⚠&nbsp;&nbsp;CROWD DENSITY ALERT — TOO MANY PERSONS IN FRAME
</div>

<script>
// ── Chart setup ──────────────────────────────────────────────────────────────
const MAX_POINTS = 120;

const chartData = {
  labels: [],
  datasets: [
    {
      label: 'Persons',
      data: [],
      borderColor: '#00e5ff',
      backgroundColor: 'rgba(0,229,255,0.07)',
      borderWidth: 1.5,
      tension: 0.4,
      fill: true,
      pointRadius: 0,
    },
    {
      label: 'Violations',
      data: [],
      borderColor: '#ff1744',
      backgroundColor: 'rgba(255,23,68,0.07)',
      borderWidth: 1.5,
      tension: 0.4,
      fill: true,
      pointRadius: 0,
    },
  ],
};

const chart = new Chart(document.getElementById('timelineChart').getContext('2d'), {
  type: 'line',
  data: chartData,
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    interaction: { mode: 'index', intersect: false },
    plugins: { legend: { labels: { color: '#5a6480', font: { size: 11 } } } },
    scales: {
      x: { display: false },
      y: {
        min: 0,
        ticks: { color: '#5a6480', font: { size: 10 }, stepSize: 1 },
        grid: { color: 'rgba(255,255,255,0.03)' },
      },
    },
  },
});

function pushChartPoint(persons, violations, label) {
  chartData.labels.push(label);
  chartData.datasets[0].data.push(persons);
  chartData.datasets[1].data.push(violations);
  if (chartData.labels.length > MAX_POINTS) {
    chartData.labels.shift();
    chartData.datasets[0].data.shift();
    chartData.datasets[1].data.shift();
  }
  chart.update('none');
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
const connStatus = document.getElementById('connStatus');
const liveDot    = document.getElementById('liveDot');
let alertTimer   = null;

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onopen = () => {
    connStatus.textContent = 'LIVE';
    connStatus.classList.remove('disconnected');
  };

  ws.onclose = () => {
    connStatus.textContent = 'OFFLINE';
    connStatus.classList.add('disconnected');
    setTimeout(connect, 2000);   // auto-reconnect
  };

  ws.onmessage = (evt) => {
    const d = JSON.parse(evt.data);
    if (d.type !== 'analytics') return;
    handleAnalytics(d);
  };
}

function handleAnalytics(d) {
  // Metrics
  document.getElementById('mPersons').textContent    = d.person_count;
  document.getElementById('mCompliant').textContent  = d.compliant_count;
  document.getElementById('mViolations').textContent = d.violation_count;
  document.getElementById('mFps').textContent        = d.fps.toFixed(1);
  document.getElementById('hFps').textContent        = d.fps.toFixed(1);

  // Chart
  const t = new Date(d.timestamp * 1000).toLocaleTimeString();
  pushChartPoint(d.person_count, d.violation_count, t);

  // Violations log
  if (d.new_violations && d.new_violations.length > 0) {
    const log = document.getElementById('violLog');
    // Remove placeholder
    const placeholder = log.querySelector('.no-violations');
    if (placeholder) placeholder.remove();

    d.new_violations.forEach(v => {
      const row = document.createElement('div');
      row.className = 'viol-row';
      const ts = new Date(d.timestamp * 1000).toLocaleTimeString();
      row.innerHTML = `
        <span class="tid">#${v.track_id}</span>
        <span class="tag">${v.type}</span>
        <span style="color:var(--muted);font-size:10px">${ts}</span>
      `;
      log.prepend(row);
    });
    // Keep last 30
    while (log.children.length > 30) log.lastChild.remove();
  }

  // Counting lines
  if (d.line_counts && Object.keys(d.line_counts).length > 0) {
    const container = document.getElementById('lineCountsContainer');
    container.innerHTML = Object.entries(d.line_counts).map(([id, counts]) =>
      `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--accent);font-family:var(--font-mono);font-size:11px">${id}</span>
        <span style="font-family:var(--font-mono);font-size:11px">
          ↑<span style="color:var(--green)">${counts.in||0}</span>
          &nbsp;↓<span style="color:var(--red)">${counts.out||0}</span>
        </span>
      </div>`
    ).join('');
  }

  // Crowd alert
  if (d.crowd_alert) {
    document.getElementById('alertBanner').classList.add('visible');
    clearTimeout(alertTimer);
    alertTimer = setTimeout(() => {
      document.getElementById('alertBanner').classList.remove('visible');
    }, 4000);
  }
}

// ── Fetch initial frame stats ─────────────────────────────────────────────────
async function loadHistory() {
  // frame-stats endpoint removed — chart starts empty and fills via WebSocket
}

loadHistory();
connect();
</script>
</body>
</html>
